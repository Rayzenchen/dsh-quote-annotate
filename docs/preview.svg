<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Select text in the transcript; the selection becomes a quote chip in the composer with a comment card, and the sent annotation folds into a badge">
  <!-- left: transcript -->
  <rect x="32" y="38" width="324" height="224" rx="14" fill="#8A93A6" fill-opacity=".09" stroke="#8A93A6" stroke-opacity=".34" stroke-width="1.4"/>
  <rect x="56" y="60" width="112" height="9" rx="4.5" fill="#8A93A6" fill-opacity=".55"/>

  <!-- assistant bubble -->
  <rect x="44" y="80" width="300" height="112" rx="10" fill="#8A93A6" fill-opacity=".10" stroke="#8A93A6" stroke-opacity=".26" stroke-width="1.2"/>
  <rect x="60" y="96" width="96" height="6" rx="3" fill="#6B7688" fill-opacity=".38"/>
  <rect x="60" y="110" width="248" height="6" rx="3" fill="#6B7688" fill-opacity=".46"/>
  <rect x="60" y="122" width="212" height="6" rx="3" fill="#6B7688" fill-opacity=".46"/>
  <rect x="60" y="134" width="236" height="6" rx="3" fill="#6B7688" fill-opacity=".46"/>
  <rect x="60" y="146" width="150" height="6" rx="3" fill="#6B7688" fill-opacity=".38"/>

  <!-- the selected passage -->
  <rect x="54" y="105" width="204" height="47" rx="7" fill="#5B9BF5" fill-opacity=".16" stroke="#5B9BF5" stroke-opacity=".35" stroke-width="1"/>
  <path d="M64 112 H56 l7 6 -7 6 h8" fill="none" stroke="#5B9BF5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- floating add-to-input button -->
  <rect x="266" y="112" width="64" height="24" rx="12" fill="#5B9BF5" fill-opacity=".18" stroke="#5B9BF5" stroke-opacity=".85" stroke-width="1.3"/>
  <path d="M278 118 v12 M272 124 h12" stroke="#5B9BF5" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="292" y="121" width="28" height="5" rx="2.5" fill="#5B9BF5" fill-opacity=".75"/>

  <!-- pointer near the button -->
  <path d="M316 138 l0 15 4.2 -3.8 2.8 6.6 3.8 -1.8 -2.8 -6.2 5.6 -0.6 z" fill="#6B7688" fill-opacity=".5"/>

  <!-- user bubble -->
  <rect x="68" y="204" width="276" height="30" rx="10" fill="#8A93A6" fill-opacity=".10"/>
  <rect x="84" y="216" width="120" height="6" rx="3" fill="#6B7688" fill-opacity=".42"/>

  <!-- flow arrow -->
  <path d="M364 150 H390" stroke="#5B9BF5" stroke-width="3" stroke-linecap="round"/>
  <path d="M384 143 L393 150 L384 157" fill="none" stroke="#5B9BF5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right: comment card + composer -->
  <rect x="404" y="38" width="212" height="224" rx="14" fill="#8A93A6" fill-opacity=".09" stroke="#8A93A6" stroke-opacity=".34" stroke-width="1.4"/>

  <!-- comment card above the composer -->
  <rect x="418" y="52" width="184" height="84" rx="10" fill="#8A93A6" fill-opacity=".08" stroke="#8A93A6" stroke-opacity=".30" stroke-width="1.2"/>
  <rect x="432" y="64" width="14" height="14" rx="4" fill="#5B9BF5" fill-opacity=".22"/>
  <path d="M439 68 v7" stroke="#5B9BF5" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="452" y="67" width="66" height="7" rx="3.5" fill="#6B7688" fill-opacity=".50"/>
  <path d="M576 67 l5 5 -5 5" fill="none" stroke="#6B7688" stroke-opacity=".45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="432" y="84" width="92" height="18" rx="9" fill="#5B9BF5" fill-opacity=".18" stroke="#5B9BF5" stroke-opacity=".55" stroke-width="1"/>
  <path d="M441 87 H437 l5 5 -5 5 h5" fill="none" stroke="#5B9BF5" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="452" y="90" width="60" height="5" rx="2.5" fill="#5B9BF5" fill-opacity=".70"/>

  <rect x="432" y="110" width="120" height="6" rx="3" fill="#6B7688" fill-opacity=".50"/>
  <rect x="558" y="106" width="2" height="14" rx="1" fill="#5B9BF5"/>
  <rect x="432" y="121" width="80" height="4" rx="2" fill="#6B7688" fill-opacity=".30"/>

  <!-- composer -->
  <rect x="418" y="146" width="184" height="76" rx="12" fill="#8A93A6" fill-opacity=".10" stroke="#8A93A6" stroke-opacity=".32" stroke-width="1.2"/>
  <rect x="432" y="158" width="72" height="20" rx="10" fill="#5B9BF5" fill-opacity=".18" stroke="#5B9BF5" stroke-opacity=".60" stroke-width="1.1"/>
  <path d="M442 161 H438 l5 5 -5 5 h5" fill="none" stroke="#5B9BF5" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="453" y="165" width="40" height="5" rx="2.5" fill="#5B9BF5" fill-opacity=".75"/>
  <rect x="512" y="160" width="2" height="16" rx="1" fill="#5B9BF5"/>
  <rect x="432" y="194" width="96" height="5" rx="2.5" fill="#6B7688" fill-opacity=".35"/>

  <!-- send button -->
  <circle cx="580" cy="190" r="12" fill="#5B9BF5"/>
  <path d="M580 196 v-11 m-4.5 4.5 l4.5 -4.5 l4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sent message: the annotation block folds into one badge -->
  <rect x="418" y="232" width="122" height="14" rx="7" fill="#5B9BF5" fill-opacity=".12" stroke="#5B9BF5" stroke-opacity=".35" stroke-width="1"/>
  <rect x="430" y="237" width="36" height="4" rx="2" fill="#5B9BF5" fill-opacity=".65"/>
  <path d="M474 236 l4 4 -4 4" fill="none" stroke="#5B9BF5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
